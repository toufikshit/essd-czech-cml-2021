name: tests

on:
  push:
  pull_request:

jobs:
  synthetic-tests:
    # Synthetic fixtures only: no real data products, no long computations.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,science]"
      - name: Verify preserved originals are byte-identical
        run: python tools_verify_originals.py
      - name: Run regression tests
        run: python -m pytest -q tests
      - name: Synthetic connected chain
        run: python tests/run_connected_mini.py --out-dir results/mini_connected_demo
