name: tests

on:
  push:
  pull_request:

jobs:
  synthetic-tests:
    # Artificial test files only: no real data, no long computations.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,science]"
      - name: Check that the scripts in original/ are unchanged
        run: python tools_verify_originals.py
      - name: Run tests
        run: python -m pytest -q tests
