[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "essd-cz"
version = "1.0.0rc1"
description = "Processing and analysis workflow for the Czech 2021 commercial microwave link dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Taoufiq Shit" },
]
keywords = ["commercial microwave links", "rainfall", "water vapour", "Czech Republic"]
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "netCDF4",
  "scipy",
  "matplotlib",
]

[project.optional-dependencies]
# original rainfall recomputation (notebooks 01 and 02, run.py compare-rainfall)
science = ["numba", "pycomlink"]
# CHMI CSV to NetCDF download and conversion (notebook 08)
chmi = ["requests", "beautifulsoup4", "tqdm"]
# notebook kernel
notebooks = ["nbformat", "ipykernel"]
# regression tests
test = ["pytest", "nbformat"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["essd_cz"]
