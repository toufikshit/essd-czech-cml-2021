[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "essd-cz"
version = "1.0.0rc1"
description = "Processing and analysis workflow for the Czech 2021 commercial microwave link dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Taoufiq Shit" },
]
keywords = ["commercial microwave links", "rainfall", "water vapour", "Czech Republic"]
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "netCDF4",
  "scipy",
  "matplotlib",
]

[project.optional-dependencies]
# quality control and rainfall retrieval (scripts/qc_from_raw.py, scripts/rainfall_1min.py)
science = ["numba", "pycomlink"]
# maps of Figs. 1 and 7
figures = ["cartopy", "pillow"]
# radar along the CML paths (scripts/radar_cml_paths.py)
radar = ["poligrain", "requests", "tqdm"]
# WVD retrieval from the raw signals (original/code/wvd/13_*, 19_*)
wvd = ["itur"]
# CHMI CSV to NetCDF converter (original/code/chmi/)
chmi = ["requests", "beautifulsoup4", "tqdm"]
# notebooks
notebooks = ["nbformat", "ipykernel"]
# tests
test = ["pytest", "nbformat"]
# everything
all = ["numba", "pycomlink", "cartopy", "pillow", "poligrain", "requests", "tqdm", "itur", "beautifulsoup4",
       "nbformat", "ipykernel", "pytest"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["essd_cz"]
